name: iOS build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.1.0" }
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
      - name: Build Compose framework (iosArm64, release)
        run: gradle :composeApp:linkReleaseFrameworkIosArm64 --stacktrace
      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen generate
      - name: Build app (unsigned)
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO SYMROOT="$PWD/build" build | tail -30
      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R iosApp/build/Release-iphoneos/Materia.app out/Payload/
          cd out && zip -qry Materia-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Materia-unsigned-ipa
          path: out/Materia-unsigned.ipa
