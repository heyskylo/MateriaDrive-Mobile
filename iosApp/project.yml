# XcodeGen spec: the Xcode project is generated on CI (`xcodegen generate`), never committed.
name: iosApp
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Materia
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        # Must match the App ID in the provisioning profile used for local signing.
        PRODUCT_BUNDLE_IDENTIFIER: app.salmon632.kumquat9999
        PRODUCT_NAME: Materia
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/bin/iosArm64/releaseFramework
        OTHER_LDFLAGS: [-framework, ComposeApp]
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
